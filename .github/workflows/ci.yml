name: CI

on:
  push:
    branches-ignore:
      - dependabot/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python
    runs-on: [self-hosted, linux, x64, controlgraph]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: [self-hosted, linux, x64, controlgraph]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build

  terraform:
    name: Terraform
    runs-on: [self-hosted, linux, x64, controlgraph]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.3"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize and validate every stack
        shell: bash
        run: |
          set -euo pipefail
          stacks=()
          if [[ -f versions.tf ]]; then
            stacks+=(.)
          fi
          for stack in bootstrap foundation runtime; do
            if [[ -f "$stack/versions.tf" ]]; then
              stacks+=("$stack")
            fi
          done
          test "${#stacks[@]}" -gt 0
          for stack in "${stacks[@]}"; do
            terraform -chdir="$stack" init -backend=false -lockfile=readonly
            terraform -chdir="$stack" validate
          done

  security:
    name: Security
    runs-on: [self-hosted, linux, x64, controlgraph]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check clean-room and secret boundaries
        run: uv run --project backend --frozen python scripts/check_clean_room.py
      - name: Audit Python dependencies
        run: |
          uv export --project backend --frozen --no-dev --no-emit-project --quiet --output-file /tmp/controlgraph-requirements.txt
          uvx pip-audit==2.10.1 --requirement /tmp/controlgraph-requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
