[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controlgraph-canary"
version = "0.1.0"
description = "Epoch-fenced Cloud Run canary controller scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ControlGraph Canary contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.122,<7",
  "httpx>=0.28,<1",
  "mypy>=1.13,<3",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
controlgraph-canary = "controlgraph_canary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controlgraph_canary = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["controlgraph_canary"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
